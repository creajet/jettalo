<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JETTALO MES LOISIRS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            background: linear-gradient(135deg, #0f172a 0%, #080d1a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin: 10px 0 30px;
            width: 100%;
            max-width: 1100px;
        }

        /* Bannière responsive */
        .banner-container {
            width: 100%;
            max-height: 250px;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
            border: 1px solid #1e293b;
        }

        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        header h1 {
            font-size: 2.8rem;
            color: #38bdf8;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(56, 189, 248, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
            box-shadow: 0 12px 30px rgba(56, 189, 248, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
        }

        .card-header span {
            font-size: 1.8rem;
        }

        .card-header h2 {
            font-size: 1.4rem;
            color: #f8fafc;
        }

        .links-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links-list a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #090e17;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #1e293b;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .links-list a:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            font-weight: 600;
            padding-left: 20px;
        }

        .links-list a::after {
            content: "➔";
            font-size: 0.9rem;
            opacity: 0.7;
        }

        footer {
            margin-top: auto;
            padding: 30px 0 10px;
            color: #64748b;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <!-- Emplacement de la bannière -->
        <div class="banner-container">
            <img src="images/ban.jpg" alt="Bannière Jettalo Mes Loisirs">
        </div>

        <h1>JETTALO MES LOISIRS</h1>
        <p>Bienvenue sur mon espace personnel</p>
    </header>

    <main class="container">

        <!-- CADRE 1 : Pigeons -->
        <div class="card">
            <div class="card-header">
                <span>🐦</span>
                <h2>Pigeons</h2>
            </div>
            <ul class="links-list">
                <li><a href="http://jettalo62210.free.fr/gestion/" target="_blank">Gestion</a></li>
                <li><a href="#" target="_blank">Lien à définir 2</a></li>
            </ul>
        </div>

        <!-- CADRE 2 : Électronique -->
        <div class="card">
            <div class="card-header">
                <span>⚡</span>
                <h2>Électronique & Bricolage</h2>
            </div>
            <ul class="links-list">
                <li><a href="#" target="_blank">Lien à définir 3</a></li>
                <li><a href="#" target="_blank">Lien à définir 4</a></li>
            </ul>
        </div>

        <!-- CADRE 3 : Radio -->
        <div class="card">
            <div class="card-header">
                <span>📻</span>
                <h2>Radio & Projets</h2>
            </div>
            <ul class="links-list">
                <li><a href="#" target="_blank">Lien à définir 5</a></li>
                <li><a href="#" target="_blank">Lien à définir 6</a></li>
            </ul>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 - jettalo62210.free.fr</p>
    </footer>

</body>
</html>
